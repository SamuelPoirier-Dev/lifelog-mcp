[project]
name = "lifelog"
version = "0.1.0"
description = "Personal lifelog exposed as a remote MCP server."
authors = [{ name = "Samuel Poirier" }]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "azure-identity>=1.27.0",
    "fastmcp>=4.1.4",
    "py-key-value-aio[azure-tables]>=0.4.6",
    "pydantic-settings>=2.16.1",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Tests against the real Azure storage run only on request: uv run pytest -m azure (D52).
markers = ["azure: runs against the real Azure Table Storage (needs LIFELOG_TEST_TABLE_ACCOUNT)"]
addopts = "-m 'not azure'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
